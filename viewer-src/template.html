<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Micro assembly model</title><link rel="icon" href="/icon.svg"><style>
*{box-sizing:border-box}body{margin:0;color:#30382c;background:#f7f8f3;font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{padding:0 16px 13px}.viewer{position:relative;height:475px;overflow:hidden}.viewer canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}.viewer canvas:active{cursor:grabbing}.toolbar{position:absolute;top:12px;left:0;right:0;display:flex;gap:5px;flex-wrap:wrap;z-index:2;align-items:center}.toolbar button{font-size:10px;padding:5px 9px;min-height:28px;background:#fff9}.toolbar label{font-size:10px;margin-left:auto;display:flex;align-items:center;gap:4px;padding:5px}.toolbar .separate{margin-left:7px}.hint{position:absolute;left:0;bottom:10px;font-size:10px;color:#8b9281;pointer-events:none}.view-state{display:none}.annotation{position:absolute;pointer-events:none;transform:translate(9px,-50%);font-size:10px;background:#ffffffda;color:#616c56;border:1px solid #dce2d3;padding:3px 6px;border-radius:4px;white-space:nowrap}.annotation:before{content:'·';margin-right:5px;font-weight:bold}.error{position:absolute;inset:30% 10%;background:#fff8e8;padding:22px;border:1px solid #e6d9b7}.transport{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}button{font:inherit;color:inherit;border:1px solid #d9e0d0;border-radius:5px;background:transparent;padding:8px 12px;cursor:pointer;font-size:11px;min-height:34px}button:hover{background:#e9edde}button.primary{background:#303c29;border-color:#303c29;color:white;min-width:125px}button:disabled{opacity:.35;cursor:default}button[aria-pressed=true]{border-color:#909d7b;background:#e9efdf}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7d9259;outline-offset:2px}.speed{margin-left:auto;font-size:10px;color:#7a856c;display:flex;align-items:center;gap:6px}select{font:inherit;color:inherit;background:#f7f8f3;border:1px solid #d9e0d0;border-radius:4px;padding:5px}.timeline{margin-top:10px}.timeline label{display:flex;justify-content:space-between;font-size:9px;color:#818c73}.timeline input{width:100%;margin:7px 0;accent-color:#546a3d}.stage-bar{display:flex;gap:20px;align-items:flex-start;border-top:1px solid #e3e8da;margin-top:10px;padding-top:12px}.step-counter{font:9px ui-monospace,monospace;color:#919985;white-space:nowrap;margin-top:3px}.step-title{font-size:12px;font-weight:500;margin:0 0 4px}.step-desc{font-size:11px;color:#7b866c;line-height:1.5;margin:0;max-width:780px}.hidden,[hidden]{display:none!important}@media(max-width:600px){main{padding:0 10px 12px}.viewer{height:440px}.toolbar{gap:4px}.toolbar label{margin-left:0}.toolbar .separate{margin-left:0}.toolbar button{font-size:9px;padding:5px 7px}.annotation{font-size:9px}.hint{font-size:9px}.speed{margin-left:0}.transport{gap:6px}.transport button{font-size:10px;padding:7px 11px}.stage-bar{gap:8px;flex-direction:column}.step-desc{font-size:10px;line-height:1.6}.timeline label{font-size:9px}}
</style></head><body><main>
<div class="viewer" id="viewer"><div class="toolbar"><button data-view="iso" aria-pressed="true">Perspective</button><button data-view="top" aria-pressed="false">Top</button><button data-view="bottom" aria-pressed="false">Underside</button><button id="explode" class="separate">Exploded</button><button id="assembled">Assembled</button><label><input type="checkbox" id="xray">See through</label></div><div class="view-state" id="view-state"></div><div id="labels"></div><div id="fallback" class="error" role="alert" hidden>3D graphics are unavailable in this browser. You can still use the parts list and written instructions below.</div><div class="hint">Drag to rotate · scroll or pinch to zoom · click a part</div></div>
<div class="transport"><button class="primary" id="play">Play assembly</button><button id="prev" aria-label="Previous stage">← Back</button><button id="next" aria-label="Next stage">Next →</button><label class="speed">Speed <select id="speed"><option value=".65">Slow</option><option value="1" selected>Normal</option><option value="1.7">Fast</option></select></label></div>
<div class="timeline"><label for="progress"><span>Exploded</span><span>Assembled</span></label><input id="progress" type="range" min="0" max="11" step=".01" value="11" aria-label="Assembly progress"></div>
<div class="stage-bar"><div class="step-counter" id="step-counter"></div><div><h2 class="step-title" id="step-title"></h2><p class="step-desc" id="step-desc"></p></div></div>
<div class="hidden"><div id="selected" aria-live="polite"></div><ul id="part-list"></ul><select id="step-jump" aria-label="Jump to assembly stage"></select></div>
</main><script src="/viewer/three.min.js"></script><script src="/viewer/model-data.js"></script><script src="/viewer/assembly.js"></script></body></html>
