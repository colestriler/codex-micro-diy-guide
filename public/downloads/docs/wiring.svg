<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630">
<rect width="1080" height="630" fill="#f1f2ed"/>
<style>text{font-family:Arial,sans-serif;fill:#182829} .h{font-size:22px;font-weight:700}.s{font-size:15px}.m{font:14px monospace}.box{fill:white;stroke:#ccd3cc;stroke-width:1.5}.wire{fill:none;stroke:#4c7769;stroke-width:3}.power{stroke:#b87545}.g{stroke:#68706c}</style>
<text x="40" y="44" class="h">DIY wiring map · KB2040 · USB-C only</text><text x="40" y="72" class="s">Signal schematic. All grounds connect. This is the custom prototype, not OEM electronics.</text>
<rect x="393" y="147" width="272" height="354" rx="12" class="box"/><text x="418" y="181" class="h">KB2040</text>
<text x="418" y="210" class="m">USB-C → computer</text><text x="418" y="245" class="m">RAW → protected 5 V rail</text><text x="418" y="271" class="m">3V  → joystick supply</text><text x="418" y="297" class="m">GND → common ground</text><text x="418" y="334" class="m">D2–D5   rows R1–R4</text><text x="418" y="359" class="m">D6–D9   cols C1–C4</text><text x="418" y="395" class="m">A0 / A1 → joystick X/Y</text><text x="418" y="421" class="m">TX / RX → encoder A/B</text><text x="418" y="447" class="m">A2 → encoder button</text><text x="418" y="473" class="m">D10 → copper touch pad</text>
<rect x="35" y="140" width="292" height="170" rx="12" class="box"/><text x="55" y="170" class="h">13-switch matrix</text><text x="55" y="201" class="m">Column → switch → diode → row</text><text x="55" y="229" class="s">Diode band / cathode faces the row.</text><text x="55" y="256" class="s">13 diodes, including both wide-key switches.</text><text x="55" y="284" class="s">Empty cells: R1C1, R1C4, R4C1.</text>
<path d="M327 233 H360 V344 H393" class="wire"/>
<rect x="35" y="350" width="292" height="150" rx="12" class="box"/><text x="55" y="380" class="h">Analog + tactile</text><text x="55" y="412" class="s">Joystick VCC = 3.3 V, never 5 V.</text><text x="55" y="440" class="s">Encoder common + button return → GND.</text><text x="55" y="468" class="s">Touch: D10 to GND through 1 MΩ.</text><path d="M327 425 H393" class="wire"/>
<rect x="724" y="140" width="321" height="210" rx="12" class="box"/><text x="744" y="171" class="h">14 RGBW LEDs</text><text x="744" y="203" class="m">MOSI → 74AHCT125 → 330Ω → DIN</text><text x="744" y="232" class="s">Level shifter and pixels use RAW / GND.</text><text x="744" y="258" class="s">DOUT → DIN, then repeat along chain.</text><text x="744" y="284" class="s">0–5: agent keys • 6–13: perimeter.</text><text x="744" y="310" class="s">GRBW order • firmware brightness 15%.</text><text x="744" y="333" class="s">100 µF across LED rail; 100 nF at IC.</text>
<path d="M665 244 H695 V211 H724" class="wire power"/>
<rect x="724" y="393" width="321" height="108" rx="12" class="box"/><text x="744" y="424" class="h">3 status indicators</text><text x="744" y="454" class="m">SCK / MISO / A3 → 1kΩ → LED</text><text x="744" y="480" class="s">LED cathodes → GND. Three 3 mm LEDs.</text><path d="M665 448 H724" class="wire"/>
<text x="40" y="551" class="s">74AHCT125: 14=RAW, 7=GND, 1=GND, 2=MOSI, 3=330Ω→DIN. Tie unused inputs 5/9/12 to GND.</text>
<text x="40" y="579" class="s">Disable unused gates: 4/10/13=RAW; leave outputs 6/8/11 open. Confirm DIP orientation against the datasheet.</text>
<text x="40" y="608" class="s">Keep the KB2040 fuse bypass jumper OPEN. Inspect polarity and check for power-to-ground shorts before connecting USB.</text>
</svg>
