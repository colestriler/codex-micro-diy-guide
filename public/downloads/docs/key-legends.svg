<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="65mm" viewBox="0 0 120 65">
<title>DIY Micro key legends — print at 100 percent</title>
<desc>Original functional symbols for six white command caps, not exact manufacturer artwork. Icons are about 6 mm wide. Cut close to each icon, excluding labels and scale bar.</desc>
<g font-family="sans-serif" fill="#111">
<text x="7" y="7" font-size="3">DIY MICRO / COMMAND KEY LEGENDS</text>
<text x="7" y="12" font-size="2.3">Print at 100%. Measure the 20 mm bar before making decals.</text>
<text x="7" y="17" font-size="2.1">Cut close to black icons. Labels and scale marks are not decals.</text>
</g>
<g fill="none" stroke="#111" stroke-width=".45" stroke-linecap="round" stroke-linejoin="round">
<path d="M18 25l-5 6h3l-1 4 6-7h-4z"/>
<g transform="translate(35 30)"><circle r="3.2"/><path d="M-1.6 0l1.1 1.3 2-2.7"/></g>
<g transform="translate(53 30)"><circle r="3.2"/><path d="M-1.2-1.2l2.4 2.4M1.2-1.2l-2.4 2.4"/></g>
<g transform="translate(71 30)"><path d="M-3 0h2l4-3M.7-3H3v2.3M-1 0l4 3M.7 3H3V.7"/></g>
<g transform="translate(89 30)"><rect x="-1.25" y="-3.1" width="2.5" height="4.8" rx="1.25"/><path d="M-2.5 0v.5a2.5 2.5 0 0 0 5 0V0M0 3v1.2M-1.4 4.2h2.8"/></g>
<g transform="translate(107 30)"><rect x="-3.7" y="-3" width="7.4" height="6" rx="1.8"/><path d="M-2-.9l1 1-1 1M.5 1.1h1.8"/></g>
<path d="M8 49h20M8 47.5v3M28 47.5v3" stroke-width=".25"/>
</g>
<g font-family="sans-serif" font-size="2" text-anchor="middle" fill="#555">
<text x="17" y="40">Fast</text><text x="35" y="40">Approve</text><text x="53" y="40">Decline</text><text x="71" y="40">New chat</text><text x="89" y="40">Voice / 2U</text><text x="107" y="40">Send</text><text x="18" y="54">20 mm</text>
</g>
<text x="7" y="61" font-family="sans-serif" font-size="2.1" fill="#555">Printed CAD caps are blank. These symbols approximate the functional labels.</text>
</svg>
